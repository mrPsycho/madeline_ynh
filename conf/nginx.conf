# Madeline web client.
#   __PATH__/api/  -> the daemon's Unix socket (JSON API, media, live events)
#   __PATH__/      -> the static single-page app
# Both are behind the YunoHost SSO. proxy_params_with_auth forwards the
# logged-in user in the Ynh-User header, overriding anything the browser sends;
# the daemon trusts that header only.

#sub_path_only rewrite ^__PATH__$ __PATH__/ permanent;

location __PATH__/api/ {
  proxy_pass http://unix:/run/__APP__/daemon.sock:/;
  include proxy_params_with_auth;
  # Where the API lives, so the daemon can scope its unlock cookie to it
  proxy_set_header X-Forwarded-Prefix __PATH__/api;

  # Uploads are streamed to the daemon, which enforces the same limit
  client_max_body_size __UPLOAD_MAX_MB__M;
  proxy_request_buffering off;

  # Live events (Server-Sent Events) and media streaming
  proxy_buffering off;
  proxy_read_timeout 1h;
  proxy_send_timeout 1h;
}

location __PATH__/ {
  alias __INSTALL_DIR__/www/;
  index index.html;

  more_set_headers "Content-Security-Policy: default-src 'self'; img-src 'self' blob: data:; media-src 'self' blob:; script-src 'self'; style-src 'self'; connect-src 'self'; frame-ancestors 'self'; base-uri 'none'; form-action 'self'";
  more_set_headers "X-Content-Type-Options: nosniff";
  more_set_headers "Referrer-Policy: same-origin";
  more_set_headers "Cache-Control: no-cache";
}
